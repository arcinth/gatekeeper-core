name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.m2/repository, keyed on pom.xml.
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      # GitHub-hosted ubuntu-latest runners ship with a running Docker daemon,
      # so the Testcontainers-based integration tests run as part of this build
      # rather than being skipped.
      - name: Build and test
        working-directory: backend
        run: ./mvnw clean package

      - name: Upload Surefire Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn

      # Without this, every run downloaded the entire NVD CVE database from scratch
      # (nothing persisted `~/.dependency-check-data` between runs) - combined with
      # NVD's public, no-API-key rate limit, that's what made this step take 5+ hours
      # and eventually fail (see backend/pom.xml's dependency-check-maven
      # <configuration> for the matching dataDirectory/nvdValidForHours settings).
      # Keyed per-run (always unique, so every run saves a fresh cache reflecting
      # whatever the NVD update step just did); restore-keys falls back via prefix
      # match to the most recent prior run's cache.
      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: depcheck-nvd-${{ github.run_id }}
          restore-keys: |
            depcheck-nvd-

      # Milestone 10: Security Hardening. A separate step (not bound into the
      # `mvn clean package` lifecycle in pom.xml) so a normal local build never pays
      # the cost of a vulnerability-database refresh - only CI does. Fails the job on
      # any currently-known CVSS >= 7 (High/Critical) finding - see
      # docs/Security-Hardening.md for the severity policy and how to record an
      # accepted-risk suppression.
      - name: OWASP Dependency-Check
        working-directory: backend
        # NVD_API_KEY is optional (see pom.xml) - if a repository secret of that name
        # is ever added, this passes it through and raises the NVD API rate limit;
        # left unset it's an empty string and dependency-check runs unauthenticated
        # exactly as before, just now against a cached database.
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw org.owasp:dependency-check-maven:check

      # if-no-files-found: warn, explicit rather than relying on the action's
      # own default - always() means this step also runs when an earlier step
      # in the job failed, including "Build and test" itself, in which case
      # Dependency-Check never ran and never produced a report at all. That's
      # an expected, non-broken outcome (there is nothing to upload yet, not
      # a mistake), not something that should itself show as a failed step.
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn

      # CycloneDX SBOM (Milestone 10: Security Hardening) - a machine-readable bill of
      # materials for every dependency in this build, published as a build artifact.
      - name: Generate SBOM
        working-directory: backend
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: backend/target/bom.json
          if-no-files-found: warn
